<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1인칭 낚시</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #05070a;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Segoe UI', sans-serif;
    overflow: hidden;
  }
  #wrap { display: flex; flex-direction: column; align-items: center; gap: 8px; }

  #topbar {
    width: 900px; display: flex; justify-content: space-between; align-items: center;
    color: #fff; background: linear-gradient(180deg, rgba(20,30,45,0.9), rgba(10,16,24,0.9));
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px; padding: 8px 14px;
  }
  .chip { display: flex; align-items: center; gap: 6px; font-size: 13px; }
  .chip b { font-size: 15px; }
  .btn {
    padding: 8px 14px; font-size: 13px; border: none; border-radius: 7px;
    background: #263544; color: #dce6ef; font-weight: bold; cursor: pointer;
    border: 1px solid rgba(255,255,255,0.08);
  }
  .btn:hover { background: #33475a; }
  .btn.active { background: linear-gradient(180deg,#5fd0ff,#2b9fe0); color: #00222e; border-color: #7fdcff; }

  /* ---- Level bar (mobile RPG-style progression) ---- */
  #levelBar { width: 900px; display: flex; align-items: center; gap: 8px; color: #fff; font-size: 12px; }
  .lvChip {
    background: linear-gradient(135deg,#ffd54f,#ff8f00); color: #3a2400; font-weight: 900;
    padding: 3px 10px; border-radius: 20px; white-space: nowrap;
  }
  #lvTitle {
    font-size: 12px; font-weight: bold; color: #dce6ef; background: rgba(255,255,255,0.08);
    padding: 3px 10px; border-radius: 20px; white-space: nowrap;
  }
  #expTrack { flex: 1; height: 8px; background: rgba(255,255,255,0.12); border-radius: 6px; overflow: hidden; }
  #expFill { height: 100%; width: 0%; background: linear-gradient(90deg,#5fd0ff,#2b9fe0); transition: width 0.25s; }

  #stageWrap { position: relative; border-radius: 10px; overflow: hidden; box-shadow: 0 14px 46px rgba(0,0,0,0.65); }
  canvas { background: #123; display: block; }

  #msg {
    position: absolute; left: 50%; top: 14px; transform: translateX(-50%);
    color: #fff; font-size: 13px; text-align: center; padding: 5px 14px;
    background: rgba(0,0,0,0.4); border-radius: 20px; letter-spacing: 0.3px;
    text-shadow: 0 1px 3px rgba(0,0,0,0.6);
  }

  /* ---- Rod & reel rig (first-person foreground) ---- */
  #rodRig {
    position: absolute; right: -10px; bottom: -14px; width: 300px; height: 320px; pointer-events: none;
    filter: drop-shadow(0 6px 10px rgba(0,0,0,0.5));
    transform-origin: 70% 95%;
    animation: rodIdle 3.4s ease-in-out infinite;
  }
  @keyframes rodIdle { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(-1.1deg); } }
  #rodRig.flick { animation: rodFlick 0.45s cubic-bezier(.2,.9,.3,1); }
  @keyframes rodFlick {
    0%   { transform: rotate(0deg); }
    22%  { transform: rotate(-11deg); }
    55%  { transform: rotate(4deg); }
    100% { transform: rotate(0deg); }
  }

  /* ---- Dex overlay ---- */
  #dexOverlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.78);
    display: none; align-items: center; justify-content: center; z-index: 20;
  }
  #dexPanel {
    width: 880px; max-height: 84vh; background: linear-gradient(180deg,#16232f,#0e1720); border-radius: 14px;
    padding: 18px 20px; color: #fff; display: flex; flex-direction: column; gap: 10px;
    box-shadow: 0 10px 50px rgba(0,0,0,0.7); border: 1px solid rgba(255,255,255,0.08);
  }
  #dexPanel h2 { margin: 0; font-size: 20px; letter-spacing: 0.5px; }
  #dexTabs { display: flex; gap: 8px; }
  #dexGrid {
    display: grid; grid-template-columns: repeat(8, 1fr); gap: 9px;
    overflow-y: auto; padding: 6px 2px; max-height: 60vh;
  }
  .dexCard {
    background: linear-gradient(180deg,#1e2f3d,#152029); border-radius: 9px; padding: 7px 5px; text-align: center;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    border: 1px solid rgba(255,255,255,0.06);
  }
  .dexCard.caught { border-color: var(--rc, #4fc3f7); box-shadow: 0 0 10px -2px var(--rc, #4fc3f7); }
  .dexCard.bossCardMini { border-color: rgba(255,82,82,0.4); }
  .dexCard .name { font-size: 10.3px; line-height: 1.2; min-height: 24px; }
  .dexCard .stars { font-size: 9px; letter-spacing: 1px; }
  .dexCard .best { font-size: 8.7px; color: #ffd54f; }
  .dexImg { display: block; margin: 0 auto; image-rendering: -webkit-optimize-contrast; }
  #dexClose { align-self: flex-end; }

  /* ---- Catch reveal (hero shot) ---- */
  #catchReveal {
    position: absolute; inset: 0; display: none; align-items: flex-end; justify-content: center;
    z-index: 16; pointer-events: none;
  }
  #catchCard {
    width: 88%; margin-bottom: 22px; background: linear-gradient(180deg, rgba(10,18,26,0.4), rgba(6,12,18,0.92));
    border-radius: 16px; padding: 14px 22px 16px; color: #fff; text-align: center;
    border: 1px solid rgba(255,255,255,0.15); backdrop-filter: blur(2px);
  }
  #catchCard.bossCard {
    border-color: #ff5252; box-shadow: 0 0 34px rgba(255,60,60,0.65);
    background: linear-gradient(180deg, rgba(46,6,6,0.55), rgba(10,2,2,0.95));
  }
  #catchCard .stars { font-size: 20px; letter-spacing: 3px; color: #ffd54f; text-shadow: 0 0 10px rgba(255,213,79,0.7); }
  #catchCard h2 { margin: 2px 0; font-size: 30px; letter-spacing: 1px; text-shadow: 0 2px 8px rgba(0,0,0,0.7); }
  #catchCard .sizeRow { font-size: 22px; color: #7fe0ff; font-weight: bold; }
  #catchCard .pointsRow { font-size: 13px; color: #ffd54f; margin-top: 2px; }
  .newTag {
    display: inline-block; background: #ff5252; color: #fff; font-size: 11px; font-weight: bold;
    padding: 2px 8px; border-radius: 10px; margin: 0 3px 4px; letter-spacing: 1px;
  }
  #trophyTag {
    display: none; background: linear-gradient(135deg,#ffd54f,#ff8f00); color: #3a2400;
    font-size: 11px; font-weight: 900; padding: 2px 10px; border-radius: 10px; margin: 0 3px 4px;
    letter-spacing: 1px; box-shadow: 0 0 10px rgba(255,193,7,0.7);
  }
  #failCard {
    width: 60%; margin-bottom: 22px; background: rgba(30,10,10,0.75); border-radius: 16px;
    padding: 14px 20px; color: #ffb3ab; text-align: center; border: 1px solid rgba(255,90,90,0.35);
    font-size: 18px; font-weight: bold; display: none;
  }

  #runWarning {
    position: absolute; left: 50%; top: 46%; transform: translate(-50%,-50%);
    color: #ff5252; font-size: 26px; font-weight: 900; letter-spacing: 1px;
    text-shadow: 0 0 14px rgba(255,0,0,0.8); display: none; z-index: 14;
  }
  #finalStandWarning {
    position: absolute; left: 50%; top: 34%; transform: translate(-50%,-50%);
    color: #ffee00; font-size: 30px; font-weight: 900; letter-spacing: 1px;
    text-shadow: 0 0 18px rgba(255,238,0,0.9); display: none; z-index: 15;
  }
  #levelUpPopup {
    position: absolute; left: 50%; top: 40%; transform: translate(-50%,-50%) scale(0.7);
    display: none; z-index: 22; text-align: center; pointer-events: none;
    background: radial-gradient(ellipse at center, rgba(30,20,0,0.55), rgba(10,8,0,0) 70%);
    padding: 30px 50px;
  }
  #levelUpPopup .lu1 {
    font-size: 16px; font-weight: 900; color: #ffd54f; letter-spacing: 3px;
    text-shadow: 0 0 12px rgba(255,213,79,0.8);
  }
  #levelUpPopup .lu2 {
    font-size: 44px; font-weight: 900; color: #fff; text-shadow: 0 0 20px rgba(255,213,79,0.9), 0 2px 6px rgba(0,0,0,0.8);
  }
  #levelUpPopup .lu3 {
    font-size: 18px; font-weight: bold; color: #7fe0ff; margin-top: 2px;
    text-shadow: 0 0 10px rgba(127,224,255,0.8);
  }
  #levelUpPopup .lu4 {
    font-size: 12px; color: #ffe08a; margin-top: 6px;
  }
  #levelUpPopup.show {
    display: block;
    animation: levelUpPop 2.2s cubic-bezier(.2,1,.3,1) forwards;
  }
  @keyframes levelUpPop {
    0%   { transform: translate(-50%,-50%) scale(0.5); opacity: 0; }
    12%  { transform: translate(-50%,-50%) scale(1.12); opacity: 1; }
    22%  { transform: translate(-50%,-50%) scale(1.0); opacity: 1; }
    82%  { transform: translate(-50%,-50%) scale(1.0); opacity: 1; }
    100% { transform: translate(-50%,-50%) scale(0.92); opacity: 0; }
  }

  #bossBanner {
    position: absolute; left: 0; right: 0; top: 0; display: none; z-index: 18;
    color: #fff; text-align: center; font-weight: 900; font-size: 21px; letter-spacing: 1px;
    padding: 10px; text-shadow: 0 2px 6px rgba(0,0,0,0.8);
    background: linear-gradient(180deg, rgba(170,0,0,0.85), rgba(70,0,0,0.35));
    animation: bossBannerFlash 0.55s ease-in-out infinite alternate;
  }
  @keyframes bossBannerFlash {
    from { background-color: rgba(170,0,0,0.85); }
    to   { background-color: rgba(255,45,45,0.95); }
  }
  #stageWrap.bossMode::after {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    box-shadow: inset 0 0 90px 14px rgba(255,25,25,0.55);
    animation: bossPulse 1.1s ease-in-out infinite;
  }
  @keyframes bossPulse { 0%,100% { opacity: 0.5; } 50% { opacity: 1; } }

  /* ---- Mobile-style bottom action bar ---- */
  #mobileBar { width: 900px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  #powerGaugeWrap { width: 230px; height: 10px; background: rgba(255,255,255,0.12); border-radius: 6px; overflow: hidden; }
  #powerFill { height: 100%; width: 0%; background: linear-gradient(90deg,#ffd54f,#ff5252); }
  #actionBtn {
    width: 84px; height: 84px; border-radius: 50%; border: none; cursor: pointer;
    background: radial-gradient(circle at 34% 30%, #8fe6ff, #2b9fe0 60%, #146a92);
    color: #00222e; font-weight: 900; font-size: 14px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.5), inset 0 2px 6px rgba(255,255,255,0.45);
    user-select: none; touch-action: none;
  }
  #actionBtn:active { transform: scale(0.94); }

  /* ---- Cloud sync (code-based, no login) ---- */
  #syncOverlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.78);
    display: none; align-items: center; justify-content: center; z-index: 25;
  }
  #syncPanel {
    width: 420px; background: linear-gradient(180deg,#16232f,#0e1720); border-radius: 14px;
    padding: 20px 22px; color: #fff; display: flex; flex-direction: column; gap: 12px;
    box-shadow: 0 10px 50px rgba(0,0,0,0.7); border: 1px solid rgba(255,255,255,0.08);
  }
  #syncPanel h2 { margin: 0; font-size: 18px; }
  #syncPanel p { margin: 0; font-size: 12px; color: #9db0c0; line-height: 1.5; }
  #syncCodeBox {
    display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.06);
    border-radius: 8px; padding: 10px 12px; font-size: 18px; font-weight: 900; letter-spacing: 2px;
    justify-content: space-between;
  }
  #syncInputRow { display: flex; gap: 8px; }
  #syncInputRow input {
    flex: 1; padding: 8px 10px; border-radius: 7px; border: 1px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.06); color: #fff; font-size: 14px; letter-spacing: 1px;
  }
  #syncStatus { font-size: 12px; color: #7fe0ff; min-height: 16px; }
  #syncClose { align-self: flex-end; }
</style>
</head>
<body>
<div id="wrap">
  <div id="topbar">
    <button class="btn" id="dexBtn">📖 도감 (<span id="dexCountTop">0</span>/<span id="dexTotalCount">80</span>)</button>
    <div class="chip">🐟 <b id="totalCatches">0</b>마리 &nbsp;·&nbsp; ⭐ <b id="totalScore">0</b>점</div>
    <div>
      <button class="btn active" id="locLake">🏞️ 호수</button>
      <button class="btn" id="locSea">🌊 먼바다</button>
      <button class="btn" id="syncBtn">🔗 동기화</button>
    </div>
  </div>

  <div id="levelBar">
    <div class="lvChip">Lv.<span id="lvNum">1</span></div>
    <div id="lvTitle">초보 낚시꾼</div>
    <div id="expTrack"><div id="expFill"></div></div>
  </div>

  <div id="stageWrap">
    <canvas id="game" width="900" height="560"></canvas>
    <div id="msg">스페이스바 또는 버튼으로 캐스팅하세요</div>
    <div id="runWarning">! 물고기가 저항한다 !</div>
    <div id="finalStandWarning">필사의 저항!!</div>
    <div id="bossBanner">⚠️ 초대형 어종 출현 ⚠️</div>
    <div id="levelUpPopup">
      <div class="lu1">LEVEL UP</div>
      <div class="lu2">Lv.<span id="luNum">2</span></div>
      <div class="lu3" id="luTitle">낚시에 맛 들인 사람</div>
      <div class="lu4" id="luBuff">저항 -2% · 성공존 +1.5% · 획득량 +1%</div>
    </div>

    <div id="catchReveal">
      <div id="catchCard">
        <div id="newTag" class="newTag" style="display:none;">NEW!</div>
        <div id="trophyTag">★ 대물 ★</div>
        <div class="stars" id="popStars">★★★☆☆</div>
        <h2 id="popName">이름</h2>
        <div class="sizeRow" id="popSize">32.4cm</div>
        <div class="pointsRow" id="popPoints">+120점</div>
      </div>
      <div id="failCard"></div>
    </div>

    <svg id="rodRig" viewBox="0 0 300 320" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="rodBlank" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#3a2a1a"/>
          <stop offset="1" stop-color="#7a5a34"/>
        </linearGradient>
        <linearGradient id="reelBody" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#565f66"/>
          <stop offset="1" stop-color="#20262b"/>
        </linearGradient>
        <radialGradient id="spoolGrad" cx="0.4" cy="0.35" r="0.7">
          <stop offset="0" stop-color="#c9d3d8"/>
          <stop offset="1" stop-color="#7c8890"/>
        </radialGradient>
      </defs>
      <line x1="40" y1="300" x2="230" y2="40" stroke="url(#rodBlank)" stroke-width="16" stroke-linecap="round"/>
      <line x1="40" y1="300" x2="230" y2="40" stroke="#241a10" stroke-width="16" stroke-linecap="round" opacity="0.18"/>
      <line x1="46" y1="292" x2="224" y2="49" stroke="rgba(255,255,255,0.35)" stroke-width="2.4" stroke-linecap="round"/>
      <g stroke="#1c130a" stroke-width="4" stroke-linecap="round" opacity="0.75">
        <line x1="72" y1="256" x2="82" y2="242"/>
        <line x1="108" y1="203" x2="118" y2="189"/>
        <line x1="144" y1="150" x2="154" y2="136"/>
        <line x1="180" y1="97" x2="190" y2="83"/>
      </g>
      <circle cx="150" cy="140" r="4.5" fill="none" stroke="#111" stroke-width="2.4"/>
      <circle cx="115" cy="192" r="5.5" fill="none" stroke="#111" stroke-width="2.6"/>
      <circle cx="80" cy="245" r="6.5" fill="none" stroke="#111" stroke-width="2.8"/>
      <g transform="translate(58,262)">
        <ellipse cx="0" cy="0" rx="30" ry="34" fill="url(#reelBody)" stroke="#0c0f12" stroke-width="2"/>
        <circle cx="0" cy="-4" r="17" fill="url(#spoolGrad)" stroke="#3d454b" stroke-width="2"/>
        <line x1="-30" y1="4" x2="-52" y2="4" stroke="#20262b" stroke-width="7" stroke-linecap="round"/>
        <circle cx="-52" cy="4" r="7" fill="#3d454b"/>
        <rect x="-8" y="26" width="16" height="26" rx="4" fill="#171b1e"/>
      </g>
      <path d="M20 320 C10 270,20 230,55 210 L70 230 C48 250,44 280,50 320 Z" fill="#caa06a" stroke="#5c4626" stroke-width="2"/>
      <path d="M100 320 C95 280,100 245,120 220 L134 236 C118 256,116 285,120 320 Z" fill="#e8b57a" stroke="#5c4626" stroke-width="2"/>
    </svg>
  </div>

  <div id="mobileBar">
    <div id="powerGaugeWrap"><div id="powerFill"></div></div>
    <button id="actionBtn">낚시</button>
  </div>
</div>

<div id="dexOverlay">
  <div id="dexPanel">
    <h2>물고기 도감</h2>
    <div id="dexTabs">
      <button class="btn active" id="tabLake">호수 (<span id="tabLakeCount">0</span>)</button>
      <button class="btn" id="tabSea">먼바다 (<span id="tabSeaCount">0</span>)</button>
      <button class="btn" id="tabSpecial">특수 (<span id="tabSpecialCount">0</span>)</button>
      <button class="btn" id="dexClose" style="margin-left:auto;">닫기</button>
    </div>
    <div id="dexGrid"></div>
  </div>
</div>

<div id="syncOverlay">
  <div id="syncPanel">
    <h2>🔗 기록 동기화</h2>
    <p>이 코드를 입력하면 어느 기기·브라우저에서든 같은 도감·점수를 이어서 볼 수 있어요. 코드를 잃어버리면 기록도 잃어버리니 꼭 저장해두세요.</p>
    <div id="syncCodeBox">
      <span id="syncCodeText">----------</span>
      <button class="btn" id="syncCopyBtn">복사</button>
    </div>
    <div id="syncInputRow">
      <input id="syncInput" type="text" placeholder="다른 기기의 코드를 입력하세요">
      <button class="btn" id="syncLoadBtn">불러오기</button>
    </div>
    <div id="syncStatus"></div>
    <button class="btn" id="syncClose">닫기</button>
  </div>
</div>

<script>
/* =========================================================

/* ----- Level titles (flavor text, changes at thresholds) ----- */
const TITLES = [
  { min:1,  title:"초보 낚시꾼" },

  { min:5,  title:"낚시광" },

  { min:12, title:"낚시의 달인" },
  { min:16, title:"전설의 조사(釣師)" },
];
function titleForLevel(lv) {
  let t = TITLES[0];
  for (const e of TITLES) if (lv >= e.min) t = e;
  return t.title;
}

/* ----- Continuous per-level catching buffs: every single level-up nudges these ----- */
function getTier(lv) {
  const tensionMul = Math.max(0.60, 1 - (lv-1)*0.02);
  const zoneMul = Math.min(1.6, 1 + (lv-1)*0.015);
  const gainMul = Math.min(1.4, 1 + (lv-1)*0.01);
  return { tensionMul, zoneMul, gainMul, title: titleForLevel(lv) };
}

function pool() { return spot === 'lake' ? LAKE_FISH : SEA_FISH; }
function fishDef(f) { return { name:f[0], rarity:f[1], minLen:f[2], maxLen:f[3], bodyType:f[4], colorKey:f[5], pattern:f[6]||null, whiskers:!!f[7] }; }

function pickWeightedFish() {
  const p = pool();
  const total = p.reduce((s,f) => s + RARITY_WEIGHT[f[1]], 0);
  let r = Math.random() * total;
  for (const f of p) { r -= RARITY_WEIGHT[f[1]]; if (r <= 0) return f; }
  return p[0];
}

/* =========================================================
   Game flow
========================================================= */
function startCast(power) {
  power = power || 0;
  state = 'casting';
  const reach = 0.46 + (power/100)*0.12;
  bobber.targetX = W * 0.28 + Math.random() * W * reach;
  bobber.targetY = HORIZON + 30 + Math.random() * (H - HORIZON - 90);
  bobber._sx = rod.tipX; bobber._sy = rod.tipY; bobber._t = 0;
  bobber._power = power;
  setMsg("풍덩! 입질을 기다리는 중...");
  const rig = document.getElementById('rodRig');
  rig.classList.remove('flick'); void rig.offsetWidth; rig.classList.add('flick');
}
function beginWaiting() {
  state = 'waiting'; waitTimer = 2 + Math.random() * 4.5;
  ripples.push({ x: bobber.x, y: bobber.y, t: 0 });
}

function triggerBite() {
  state = 'bite';
  const bossChance = spot === 'sea' ? BOSS_CHANCE_BASE + (bobber._power/100)*0.03 : 0;
  const isBoss = Math.random() < bossChance;
  const f = isBoss ? BOSS_FISH[Math.floor(Math.random()*BOSS_FISH.length)] : pickWeightedFish();
  currentFish = fishDef(f);
  biteTimer = RARITY[currentFish.rarity].hookWindow;
  shake = isBoss ? 18 : 8;
  document.getElementById('bossBanner').style.display = isBoss ? 'block' : 'none';
  setMsg(isBoss ? "!! 초대형 어종이다 – 지금이다 !!" : "지금이다! 탭하세요!");
}

function beginReeling() {
  state = 'reeling';
  const isBoss = currentFish.rarity === 'boss';
  const conf = RARITY[currentFish.rarity];
  const tier = getTier(playerLevel());
  reel.progress = 0; reel.tension = 0; reel.needleT = Math.random()*10; reel.needleDir = 1;
  reel.zoneWidth = Math.min(0.5, conf.zoneWidthRatio * tier.zoneMul);
  reel.zoneStart = Math.random() * (1 - reel.zoneWidth);
  reel.runActive = false; reel.runTimer = 0;
  reel.nextRunAt = isBoss ? 0.9 + Math.random()*0.6 : 1.4 + Math.random()*1.6;
  reel.finalStand = false; reel.finalStandDone = false; reel._finalStandStarted = false;
  document.getElementById('bossBanner').style.display = 'none';
  document.getElementById('stageWrap').classList.toggle('bossMode', isBoss);
  setMsg(isBoss ? "필사적으로 버텨라!!" : "타이밍 맞춰 탭! 릴을 감으세요");
}

function catchSuccess() {
  const isBoss = currentFish.rarity === 'boss';
  const conf = RARITY[currentFish.rarity];
  const size = (currentFish.minLen + Math.random()*(currentFish.maxLen-currentFish.minLen)).toFixed(1);
  const sizeRatio = (size-currentFish.minLen)/(currentFish.maxLen-currentFish.minLen+0.001);
  const isTrophy = !isBoss && sizeRatio >= 0.85;
  let points = Math.round(conf.points * (0.7 + 0.6*sizeRatio));
  if (isTrophy) points = Math.round(points * 1.5);
  totalScore += points; saveScore();

  const isNew = !dex[currentFish.name];
  const entry = dex[currentFish.name] || { count:0, best:0, rarity:currentFish.rarity, habitat:spot };
  entry.count += 1;
  entry.best = Math.max(entry.best, parseFloat(size));
  entry.rarity = currentFish.rarity;
  entry.habitat = spot;
  dex[currentFish.name] = entry;
  saveDex(); updateTopStats();

  resultData = { ok:true, name:currentFish.name, rarity:currentFish.rarity, size, points, isNew, isTrophy, isBoss };
  showCatchReveal(resultData);
  state = 'result'; resultTimer = isBoss ? 3.4 : 2.6;
  document.getElementById('stageWrap').classList.remove('bossMode');
}

function catchFail(reason) {
  resultData = { ok:false, reason };
  state = 'result'; resultTimer = 1.4;
  const text = reason === 'snapped' ? "줄이 끊어졌습니다!" : reason === 'escaped' ? "괴물이 사라졌다..." : "놓쳤습니다...";

  document.getElementById('stageWrap').classList.remove('bossMode');
}

/* =========================================================
   Update loop
========================================================= */
function update(dt) {
  if (shake > 0) shake = Math.max(0, shake - dt*20);
  if (spaceJustPressed) { handleSpace(); spaceJustPressed = false; }
  if (ripples.length) {
    for (const r of ripples) r.t += dt;
    ripples = ripples.filter(r => r.t < 1.3);
  }
  document.getElementById('runWarning').style.display = (state==='reeling' && reel.runActive && currentFish.rarity!=='boss') ? 'block' : 'none';

  if (charging) {
    castPower = Math.min(100, castPower + dt*160);
    document.getElementById('powerFill').style.width = castPower + '%';
  }

  if (state === 'casting') {
    bobber._t += dt * 1.8;
    const t = Math.min(1, bobber._t);
    bobber.x = bobber._sx + (bobber.targetX-bobber._sx)*t;
    bobber.y = bobber._sy + (bobber.targetY-bobber._sy)*t - Math.sin(t*Math.PI)*70;
    if (t >= 1) beginWaiting();
  } else if (state === 'waiting') {
    waitTimer -= dt;
    bobber.x = bobber.targetX;
    bobber.y = bobber.targetY + Math.sin(performance.now()/400)*2;
    if (waitTimer <= 0) triggerBite();
  } else if (state === 'bite') {
    biteTimer -= dt;
    bobber.y = bobber.targetY + Math.sin(performance.now()/55)*7;
    if (biteTimer <= 0) {
      document.getElementById('bossBanner').style.display = 'none';
      setMsg("놓쳤습니다..."); state = 'idle';
      setTimeout(()=>setMsg("스페이스바 또는 버튼으로 캐스팅하세요"), 1100);
    }
  } else if (state === 'reeling') {
    const isBoss = currentFish.rarity === 'boss';
    const conf = RARITY[currentFish.rarity];
    const tier = getTier(playerLevel());
    reel.nextRunAt -= dt;
    if (!reel.runActive && reel.nextRunAt <= 0) {
      reel.runActive = true; reel.runTimer = 0.8 + Math.random()*0.4;
    }
    if (reel.runActive) {
      reel.runTimer -= dt;
      if (reel.runTimer <= 0) { reel.runActive = false; reel.nextRunAt = (isBoss?1.6:2.2) + Math.random()*2; }
    }
    if (isBoss && !reel.finalStandDone && reel.progress >= 72) {
      reel.finalStand = true;
      if (!reel._finalStandStarted) {
        reel._finalStandStarted = true;
        reel._finalStandTimer = 1.7;
        setMsg("!! 마지막 발악이다 – 버텨라 !!");
      }
      reel._finalStandTimer -= dt;
      if (reel._finalStandTimer <= 0) {
        reel.finalStandDone = true; reel.finalStand = false;
        setMsg("필사적으로 버텨라!!");
      }
    }
    document.getElementById('finalStandWarning').style.display = reel.finalStand ? 'block' : 'none';

    const finalMul = reel.finalStand ? (isBoss?1.15:1.45) : 1;
    const runMul = reel.runActive ? (isBoss?1.5:1.9) : 1;
    const speedMul = (1 + 0.7*(reel.progress/100)) * runMul * finalMul;
    if (isBoss && Math.random() < dt*0.3) reel.needleDir *= -1;
    reel.needleT += dt * conf.needleSpeed * speedMul * (isBoss ? reel.needleDir : 1);
    reel.tension = Math.min(100, reel.tension + dt * conf.tensionRate * tier.tensionMul * (reel.runActive?(isBoss?1.3:1.6):1) * (reel.finalStand?(isBoss?1.1:1.25):1));
    if (reel.flashT > 0) reel.flashT -= dt;
    if (reel.tension >= 100) catchFail(isBoss ? 'escaped' : 'snapped');
  } else if (state === 'result') {
    resultTimer -= dt;
    if (resultTimer <= 0) {
      state = 'idle';
      bobber.x = rod.tipX; bobber.y = rod.tipY;
      setMsg("스페이스바 또는 버튼으로 캐스팅하세요");
    }
  }
}

function needleX() { return 0.5 + 0.42*Math.sin(reel.needleT); }

function handleSpace() {
  if (state === 'idle') { startCast(0); }
  else if (state === 'bite') { beginReeling(); }
  else if (state === 'reeling') {
    const nx = needleX();
    const inZone = nx >= reel.zoneStart && nx <= reel.zoneStart + reel.zoneWidth;
    reel.flashT = 0.15;
    const isBoss = currentFish.rarity === 'boss';
    const conf = RARITY[currentFish.rarity];
    const tier = getTier(playerLevel());
    if (inZone) {
      const center = reel.zoneStart + reel.zoneWidth/2;
      const dNorm = 1 - Math.min(1, Math.abs(nx-center)/(reel.zoneWidth/2));
      reel.progress = Math.min(100, reel.progress + (conf.gain + dNorm*7) * tier.gainMul);
      reel.tension = Math.max(0, reel.tension - (isBoss?15:12));
      reel.zoneWidth = Math.min(0.5, Math.max(0.1, conf.zoneWidthRatio * tier.zoneMul * (1 - (isBoss?0.2:0.35)*(reel.progress/100))));
      reel.zoneStart = Math.random() * (1 - reel.zoneWidth);
      if (reel.progress >= 100) catchSuccess();
    } else {
      reel.progress = Math.max(0, reel.progress - (isBoss?7:9));
      reel.tension = Math.min(100, reel.tension + (isBoss?10:13) * tier.tensionMul);
      shake = isBoss ? 7 : 4;
    }
  }
}

========================================================= */
function cloud(x, y, s, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = '#fff';
  for (const [dx,dy,r] of [[0,0,1],[0.7,0.1,0.7],[-0.7,0.12,0.65],[0.25,-0.35,0.6],[-0.3,-0.3,0.55]]) {
    ctx.beginPath(); ctx.arc(x+dx*s, y+dy*s, r*s*0.45, 0, Math.PI*2); ctx.fill();
  }
  ctx.restore();
}
function bird(x, y, s) {
  ctx.strokeStyle = 'rgba(40,40,40,0.55)'; ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.moveTo(x-s, y); ctx.quadraticCurveTo(x-s*0.3, y-s*0.7, x, y);
  ctx.quadraticCurveTo(x+s*0.3, y-s*0.7, x+s, y);
  ctx.stroke();
}
function lilyPad(x, y, s) {
  ctx.save();
  ctx.fillStyle = 'rgba(40,80,45,0.85)';
  ctx.beginPath();
  ctx.arc(x, y, s, 0.35, Math.PI*2 - 0.35);
  ctx.lineTo(x, y);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(20,50,25,0.6)'; ctx.lineWidth = 1; ctx.stroke();
  ctx.restore();
}

function sparkles(t, count, seedOffset) {
  ctx.save();
  for (let i=0;i<count;i++) {
    const sx = (i*137.5 + seedOffset*53) % W;
    const sy = HORIZON + 12 + ((i*71 + seedOffset*19) % (H-HORIZON-30));
    const tw = 0.4 + 0.6*Math.abs(Math.sin(t*1.8 + i*2.1));
    ctx.globalAlpha = tw * 0.55;
    ctx.fillStyle = '#fff';
    ctx.fillRect(sx, sy, 2, 2);
  }
  ctx.restore();
}

function fishSilhouette(x, y, s, dir) {
  ctx.save();
  ctx.globalAlpha = 0.16;
  ctx.fillStyle = '#04141c';
  ctx.translate(x, y); ctx.scale(dir, 1);
  ctx.beginPath();
  ctx.moveTo(s*0.5, 0);
  ctx.quadraticCurveTo(s*0.1, -s*0.28, -s*0.5, -s*0.1);
  ctx.quadraticCurveTo(-s*0.15, 0, -s*0.5, s*0.1);
  ctx.quadraticCurveTo(s*0.1, s*0.28, s*0.5, 0);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawBackgroundSea(t) {

  cloud(150, 70, 90, 0.85); cloud(430, 45, 70, 0.7); cloud(680, 90, 100, 0.8); cloud(820,55,60,0.6);
  bird(560, 65, 9); bird(600, 80, 7); bird(300,50,7);

  const sunG = ctx.createRadialGradient(W-130, 55, 4, W-130, 55, 110);

  // sun glare streak

function drawBackgroundLake(t) {

  ctx.fillStyle = '#33544a';

  ctx.fillStyle = '#2d4a34';

  ctx.lineTo(380,HORIZON-70); ctx.lineTo(560,HORIZON-30); ctx.lineTo(720,HORIZON-60);

function drawWaterTexture(t) {
  ctx.strokeStyle = 'rgba(255,255,255,0.18)';
  ctx.lineWidth = 1.6;
  for (let i=0;i<8;i++) {
    const y = HORIZON + 18 + i*(H-HORIZON-18)/8;
    ctx.beginPath();
    for (let x=0;x<=W;x+=18) ctx.lineTo(x, y + Math.sin(x/42 + t*1.4 + i)*3);
    ctx.stroke();
  }
  ctx.strokeStyle = 'rgba(0,0,0,0.08)';
  ctx.lineWidth = 1;
  for (let i=0;i<5;i++) {
    const y = HORIZON + 40 + i*(H-HORIZON-40)/5;
    ctx.beginPath();
    for (let x=0;x<=W;x+=24) ctx.lineTo(x, y + Math.cos(x/55 - t*1.1 + i)*4);
    ctx.stroke();
  }
}

function drawBackground(now) {
  const t = now/1000;
  if (spot === 'lake') drawBackgroundLake(t); else drawBackgroundSea(t);
  drawWaterTexture(t);
  // foreground dock plank strip
  ctx.fillStyle = '#33241a';
  ctx.fillRect(0, H-30, W, 30);
  ctx.fillStyle = 'rgba(255,255,255,0.07)';
  for (let x=0;x<W;x+=44) ctx.fillRect(x, H-30, 3, 30);
}

/* =========================================================
   Fish illustration (canvas) — used for catch reveal & dex thumbnails
========================================================= */
const BODY_HEIGHT_RATIO = {
  torpedo:0.30, oval:0.44, slender:0.17, flat:0.5, spiny:0.34, turtle:0.5,
  squid:0.28, crab:0.6, shark:0.30, whale:0.5, giant_squid:0.32,
};

function bodyGradient(c, colors, len) {
  const g = c.createLinearGradient(0,-len*0.28,0,len*0.28);
  g.addColorStop(0, colors.light); g.addColorStop(0.55, colors.base); g.addColorStop(1, colors.dark);
  return g;
}

function drawScales(c, len, h) {
  c.save();
  c.globalAlpha = 0.16;
  c.strokeStyle = '#ffffff';
  c.lineWidth = Math.max(0.6, len*0.006);
  for (let r=-2; r<=2; r++) {
    const y = r*h*0.16;
    for (let x=-len*0.34; x<len*0.3; x+=len*0.055) {
      c.beginPath();
      c.arc(x, y, len*0.035, Math.PI*0.15, Math.PI*0.85);
      c.stroke();
    }
  }
  c.restore();
}

function drawSpecular(c, len, h) {
  c.save();
  c.globalAlpha = 0.35;
  const g = c.createRadialGradient(len*0.06,-h*0.3,2, len*0.06,-h*0.3,len*0.32);
  g.addColorStop(0,'rgba(255,255,255,0.55)'); g.addColorStop(1,'rgba(255,255,255,0)');
  c.fillStyle = g;
  c.beginPath(); c.ellipse(len*0.06,-h*0.28,len*0.3,h*0.22,0,0,Math.PI*2); c.fill();
  c.restore();
}

function drawPattern(c, pattern, colors, len) {
  c.save();
  c.globalAlpha = 0.5;
  c.strokeStyle = colors.dark;
  c.fillStyle = colors.dark;
  if (pattern === 'stripesV') {
    c.lineWidth = Math.max(2, len*0.03);
    for (let i=-3;i<=3;i++) {
      const x = i*len*0.09;
      c.beginPath(); c.moveTo(x, -len*0.16); c.lineTo(x, len*0.16); c.stroke();
    }
  } else if (pattern === 'spots') {
    for (let i=0;i<9;i++) {
      const x = -len*0.32 + Math.random()*len*0.6;
      const y = (Math.random()-0.5)*len*0.22;
      c.beginPath(); c.arc(x,y, len*0.018+Math.random()*len*0.012, 0, Math.PI*2); c.fill();
    }
  } else if (pattern === 'lateral') {
    c.lineWidth = Math.max(2, len*0.025);
    c.beginPath(); c.moveTo(-len*0.42,0); c.lineTo(len*0.36,0); c.stroke();
  } else if (pattern === 'backwave') {
    c.lineWidth = Math.max(2, len*0.02);
    for (let i=0;i<4;i++) {
      const yy = -len*0.16 + i*len*0.04;
      c.beginPath();
      for (let x=-len*0.35;x<=len*0.35;x+=len*0.06) c.lineTo(x, yy + Math.sin(x*0.1+i)*len*0.02);
      c.stroke();
    }
  }
  c.restore();
}

function drawFishShape(c, def, len) {
  const colors = COLOR_PRESETS[def.colorKey];
  const grad = bodyGradient(c, colors, len);
  const h = len * (BODY_HEIGHT_RATIO[def.bodyType] || 0.3);

  c.save();
  if (def.bodyType === 'turtle') {
    c.fillStyle = grad;
    c.beginPath(); c.ellipse(0,0, len*0.4, h*0.5, 0, 0, Math.PI*2); c.fill();
    c.strokeStyle = colors.dark; c.lineWidth = 2; c.stroke();
    c.fillStyle = colors.dark;
    c.beginPath(); c.ellipse(len*0.42, 0, len*0.11, h*0.16, 0, 0, Math.PI*2); c.fill();
    for (const s of [-1,1]) {
      c.beginPath(); c.ellipse(len*0.12, s*h*0.32, len*0.09, h*0.1, s*0.5, 0, Math.PI*2); c.fill();
      c.beginPath(); c.ellipse(-len*0.22, s*h*0.28, len*0.08, h*0.09, -s*0.5, 0, Math.PI*2); c.fill();
    }
  } else if (def.bodyType === 'squid') {
    c.fillStyle = grad;
    c.beginPath();
    c.moveTo(len*0.32, 0);
    c.quadraticCurveTo(len*0.15, -h*0.55, -len*0.2, -h*0.4);
    c.quadraticCurveTo(-len*0.42, -h*0.15, -len*0.42, 0);
    c.quadraticCurveTo(-len*0.42, h*0.15, -len*0.2, h*0.4);
    c.quadraticCurveTo(len*0.15, h*0.55, len*0.32, 0);
    c.closePath(); c.fill();
    c.strokeStyle = colors.dark; c.lineWidth = 1.5; c.stroke();
    c.fillStyle = colors.dark;
    c.beginPath(); c.moveTo(-len*0.2,-h*0.4); c.lineTo(-len*0.42,-h*0.55); c.lineTo(-len*0.28,-h*0.18); c.closePath(); c.fill();
    c.beginPath(); c.moveTo(-len*0.2,h*0.4); c.lineTo(-len*0.42,h*0.55); c.lineTo(-len*0.28,h*0.18); c.closePath(); c.fill();
    c.strokeStyle = colors.dark; c.lineWidth = 2;
    for (let i=0;i<5;i++) {
      const yy = (i-2)*h*0.14;
      c.beginPath(); c.moveTo(len*0.3,0); c.quadraticCurveTo(len*0.5, yy, len*0.62, yy*1.3); c.stroke();
    }
  } else if (def.bodyType === 'giant_squid') {
    c.fillStyle = grad;
    c.beginPath();
    c.moveTo(len*0.34, 0);
    c.quadraticCurveTo(len*0.16, -h*0.6, -len*0.22, -h*0.44);
    c.quadraticCurveTo(-len*0.46, -h*0.16, -len*0.46, 0);
    c.quadraticCurveTo(-len*0.46, h*0.16, -len*0.22, h*0.44);
    c.quadraticCurveTo(len*0.16, h*0.6, len*0.34, 0);
    c.closePath(); c.fill();
    c.strokeStyle = colors.dark; c.lineWidth = 1.6; c.stroke();

    c.fillStyle = colors.dark;
    c.beginPath(); c.moveTo(-len*0.22,-h*0.44); c.lineTo(-len*0.5,-h*0.6); c.lineTo(-len*0.3,-h*0.2); c.closePath(); c.fill();
    c.beginPath(); c.moveTo(-len*0.22,h*0.44); c.lineTo(-len*0.5,h*0.6); c.lineTo(-len*0.3,h*0.2); c.closePath(); c.fill();

    c.strokeStyle = colors.dark; c.lineWidth = Math.max(2,len*0.018);
    for (let i=0;i<8;i++) {
      const yy = (i-3.5)*h*0.12;
      c.beginPath(); c.moveTo(len*0.32,0);
      c.quadraticCurveTo(len*0.55, yy, len*0.68, yy*1.4);
      c.stroke();
    }
    c.lineWidth = Math.max(2.5,len*0.022);
    for (const s of [-1,1]) {
      c.beginPath(); c.moveTo(len*0.32, s*h*0.05);
      c.quadraticCurveTo(len*0.7, s*h*0.5, len*0.95, s*h*0.15);
      c.stroke();
      c.fillStyle = colors.dark;
      for (let k=0;k<4;k++) {
        const tx = len*0.5 + k*len*0.14;
        c.beginPath(); c.arc(tx, s*h*(0.2+k*0.05), len*0.012,0,Math.PI*2); c.fill();
      }
    }

    const eg = c.createRadialGradient(len*0.2,-h*0.08,1, len*0.2,-h*0.08, len*0.06);
    eg.addColorStop(0,'#9be8ff'); eg.addColorStop(1,'rgba(155,232,255,0)');
    c.fillStyle = eg; c.beginPath(); c.arc(len*0.2,-h*0.08,len*0.06,0,Math.PI*2); c.fill();
    c.fillStyle = '#0a0a0a'; c.beginPath(); c.arc(len*0.2,-h*0.08,Math.max(2,len*0.022),0,Math.PI*2); c.fill();
  } else if (def.bodyType === 'shark') {
    const noseX = len*0.52, tailX = -len*0.5;
    c.fillStyle = grad;
    c.beginPath();
    c.moveTo(noseX,0);
    c.quadraticCurveTo(len*0.3,-h*0.5, tailX*0.55,-h*0.34);
    c.quadraticCurveTo(tailX*0.9,-h*0.08, tailX,0);
    c.quadraticCurveTo(tailX*0.9,h*0.08, tailX*0.55,h*0.34);
    c.quadraticCurveTo(len*0.3,h*0.5, noseX,0);
    c.closePath(); c.fill();
    c.strokeStyle = colors.dark; c.lineWidth = 2; c.stroke();

    c.fillStyle = colors.dark;
    c.beginPath();
    c.moveTo(tailX*0.55,0);
    c.quadraticCurveTo(tailX*1.05,-h*0.75, tailX*1.35,-h*0.2);
    c.quadraticCurveTo(tailX*0.95,-h*0.05, tailX*0.85,0);
    c.quadraticCurveTo(tailX*0.95,h*0.05, tailX*1.2,h*0.55);
    c.quadraticCurveTo(tailX*1.0,h*0.15,tailX*0.55,0);
    c.closePath(); c.fill();

    c.beginPath();
    c.moveTo(len*0.02,-h*0.48); c.lineTo(-len*0.05,-h*1.35); c.lineTo(-len*0.22,-h*0.46);
    c.closePath(); c.fill();

    c.beginPath();
    c.moveTo(len*0.1,h*0.2); c.lineTo(len*0.0,h*0.85); c.lineTo(-len*0.12,h*0.28);
    c.closePath(); c.fill();

    c.strokeStyle = colors.dark; c.lineWidth = Math.max(1.2,len*0.012);
    for (let i=0;i<5;i++) {
      const x = len*0.18 - i*len*0.035;
      c.beginPath(); c.moveTo(x,-h*0.28); c.lineTo(x-len*0.015,h*0.22); c.stroke();
    }

    c.strokeStyle = colors.dark; c.lineWidth = 1.4;
    c.beginPath(); c.moveTo(noseX-2,h*0.08); c.quadraticCurveTo(len*0.32,h*0.22,len*0.2,h*0.1); c.stroke();
    c.fillStyle = '#fff';
    for (let i=0;i<5;i++) {
      const x = len*0.4 - i*len*0.045;
      c.beginPath(); c.moveTo(x,h*0.1); c.lineTo(x-len*0.018,h*0.17); c.lineTo(x+len*0.018,h*0.17); c.closePath(); c.fill();
    }

    c.fillStyle = '#0a0a0a';
    c.beginPath(); c.arc(len*0.34,-h*0.06, Math.max(2,len*0.022),0,Math.PI*2); c.fill();
  } else if (def.bodyType === 'whale') {
    c.fillStyle = grad;
    c.beginPath();
    c.moveTo(len*0.46,-h*0.05);
    c.quadraticCurveTo(len*0.3,-h*0.55,-len*0.1,-h*0.5);
    c.quadraticCurveTo(-len*0.4,-h*0.4,-len*0.48,-h*0.05);
    c.quadraticCurveTo(-len*0.4,h*0.42,-len*0.05,h*0.5);
    c.quadraticCurveTo(len*0.3,h*0.5, len*0.46,-h*0.05);
    c.closePath(); c.fill();
    c.strokeStyle = colors.dark; c.lineWidth = 2; c.stroke();

    c.save();
    c.strokeStyle = colors.dark; c.globalAlpha = 0.4; c.lineWidth = Math.max(1,len*0.01);
    for (let i=0;i<6;i++) {
      const y = h*0.1 + i*h*0.06;
      c.beginPath(); c.moveTo(len*0.25,y); c.lineTo(-len*0.2,y+h*0.05); c.stroke();
    }
    c.restore();

    c.fillStyle = colors.dark;
    c.beginPath();
    c.moveTo(-len*0.44,0);
    c.quadraticCurveTo(-len*0.62,-h*0.5,-len*0.82,-h*0.42);
    c.quadraticCurveTo(-len*0.6,-h*0.12,-len*0.5,0);
    c.quadraticCurveTo(-len*0.6,h*0.12,-len*0.82,h*0.42);
    c.quadraticCurveTo(-len*0.62,h*0.5,-len*0.44,0);
    c.closePath(); c.fill();

    c.beginPath(); c.moveTo(0,-h*0.48); c.quadraticCurveTo(len*0.05,-h*0.75,len*0.15,-h*0.46); c.closePath(); c.fill();
    c.beginPath(); c.moveTo(len*0.16,h*0.18); c.quadraticCurveTo(len*0.1,h*0.6,-len*0.05,h*0.3); c.closePath(); c.fill();

    c.fillStyle = '#111';
    c.beginPath(); c.arc(len*0.32,-h*0.42, Math.max(1.6,len*0.015),0,Math.PI*2); c.fill();
    c.beginPath(); c.arc(len*0.36,-h*0.02, Math.max(1.8,len*0.02),0,Math.PI*2); c.fill();
  } else if (def.bodyType === 'crab') {
    c.fillStyle = grad;
    c.beginPath(); c.ellipse(0,0, len*0.36, h*0.5, 0, 0, Math.PI*2); c.fill();
    c.strokeStyle = colors.dark; c.lineWidth = 2; c.stroke();
    c.fillStyle = colors.base;
    for (const s of [-1,1]) {
      c.beginPath();
      c.moveTo(len*0.28, s*h*0.2);
      c.quadraticCurveTo(len*0.5, s*h*0.5, len*0.46, s*h*0.62);
      c.quadraticCurveTo(len*0.4, s*h*0.5, len*0.24, s*h*0.34);
      c.closePath(); c.fill();
      for (let i=0;i<3;i++) {
        c.strokeStyle = colors.dark; c.lineWidth = 3;
        c.beginPath(); c.moveTo(-len*0.1+i*len*0.12, s*h*0.42); c.lineTo(-len*0.16+i*len*0.12, s*h*0.66); c.stroke();
      }
    }
  } else if (def.bodyType === 'flat') {
    c.fillStyle = grad;
    c.beginPath();
    c.moveTo(len*0.46, 0);
    c.quadraticCurveTo(len*0.2, -h*0.5, -len*0.3, -h*0.34);
    c.quadraticCurveTo(-len*0.5, -h*0.1, -len*0.5, 0);
    c.quadraticCurveTo(-len*0.5, h*0.1, -len*0.3, h*0.34);
    c.quadraticCurveTo(len*0.2, h*0.5, len*0.46, 0);
    c.closePath(); c.fill();
    c.strokeStyle = colors.dark; c.lineWidth = 1.6; c.stroke();
    c.fillStyle = colors.dark;
    c.beginPath(); c.arc(len*0.28, -h*0.12, len*0.02+2, 0, Math.PI*2); c.fill();
    c.strokeStyle = 'rgba(0,0,0,0.35)'; c.lineWidth = 1;
    c.beginPath(); c.moveTo(len*0.4,-h*0.12); c.quadraticCurveTo(0,-h*0.46,-len*0.46,-h*0.06); c.stroke();
    c.beginPath(); c.moveTo(len*0.4,h*0.12); c.quadraticCurveTo(0,h*0.46,-len*0.46,h*0.06); c.stroke();
  } else {
    // torpedo / oval / slender / spiny share a fusiform silhouette with different proportions
    const noseX = len*0.5, tailX = -len*0.5;
    c.fillStyle = grad;
    c.beginPath();
    c.moveTo(noseX, 0);
    c.quadraticCurveTo(len*0.28, -h*0.55, tailX*0.62, -h*0.42);
    c.quadraticCurveTo(tailX*0.85, -h*0.14, tailX, 0);
    c.quadraticCurveTo(tailX*0.85, h*0.14, tailX*0.62, h*0.42);
    c.quadraticCurveTo(len*0.28, h*0.55, noseX, 0);
    c.closePath(); c.fill();
    c.strokeStyle = colors.dark; c.lineWidth = 1.6; c.stroke();
    drawScales(c, len, h);

    // tail fin
    c.fillStyle = colors.dark;
    if (def.bodyType === 'torpedo') {
      c.beginPath();
      c.moveTo(tailX*0.62,0);
      c.lineTo(tailX*1.18, -h*0.5);
      c.lineTo(tailX*0.95, 0);
      c.lineTo(tailX*1.18, h*0.5);
      c.closePath(); c.fill();
    } else if (def.bodyType === 'slender') {
      c.beginPath();
      c.moveTo(tailX*0.9,0);
      c.quadraticCurveTo(tailX*1.15,-h*0.3,tailX*1.2,0);
      c.quadraticCurveTo(tailX*1.15,h*0.3,tailX*0.9,0);
      c.fill();
    } else {
      c.beginPath();
      c.moveTo(tailX*0.7,0);
      c.quadraticCurveTo(tailX*1.1,-h*0.42,tailX*1.05,0);
      c.quadraticCurveTo(tailX*1.1,h*0.42,tailX*0.7,0);
      c.fill();
    }

    // dorsal fin
    c.fillStyle = colors.dark;
    if (def.bodyType === 'spiny') {
      c.beginPath();
      c.moveTo(len*0.05,-h*0.5);
      for (let i=0;i<5;i++) {
        const x = len*0.05 - i*len*0.13;
        c.lineTo(x, -h*0.95); c.lineTo(x-len*0.06, -h*0.5);
      }
      c.closePath(); c.fill();
    } else if (def.bodyType === 'oval') {
      c.beginPath();
      c.moveTo(len*0.12,-h*0.5);
      c.quadraticCurveTo(-len*0.05,-h*1.0,-len*0.25,-h*0.5);
      c.closePath(); c.fill();
    } else if (def.bodyType === 'torpedo') {
      c.beginPath();
      c.moveTo(0,-h*0.5); c.lineTo(-len*0.08,-h*0.9); c.lineTo(-len*0.2,-h*0.5);
      c.closePath(); c.fill();
    }

    // pectoral fin
    c.beginPath();
    c.moveTo(len*0.14,h*0.2); c.quadraticCurveTo(len*0.05,h*0.7,-len*0.06,h*0.32);
    c.closePath(); c.fill();

    // whiskers (catfish)
    if (def.whiskers) {
      c.strokeStyle = colors.dark; c.lineWidth = Math.max(1.4, len*0.012);
      for (const s of [-1,1]) {
        c.beginPath(); c.moveTo(noseX-2, s*h*0.1);
        c.quadraticCurveTo(noseX+len*0.15, s*h*0.25, noseX+len*0.22, s*h*0.1);
        c.stroke();
      }
    }

    // eye
    c.fillStyle = '#101010';
    c.beginPath(); c.arc(len*0.35, -h*0.1, Math.max(1.6, len*0.02), 0, Math.PI*2); c.fill();
  }

  if (def.pattern) drawPattern(c, def.pattern, colors, len);
  drawSpecular(c, len, h);
  c.restore();
}

/* =========================================================
   Foreground game elements
========================================================= */
function drawBobber() {
  if (state === 'idle' || state === 'result') return;
  ctx.save();
  ctx.translate(bobber.x, bobber.y);
  ctx.beginPath(); ctx.ellipse(0,4,9,3,0,0,Math.PI*2); ctx.fillStyle='rgba(0,0,0,0.25)'; ctx.fill();
  ctx.beginPath(); ctx.arc(0,0,7,0,Math.PI*2); ctx.fillStyle='#ff5252'; ctx.fill();
  ctx.beginPath(); ctx.arc(0,-4,7,Math.PI,Math.PI*2); ctx.fillStyle='#fff'; ctx.fill();
  ctx.restore();
  if (state === 'bite') {
    ctx.fillStyle = '#ffeb3b'; ctx.font = 'bold 28px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('!', bobber.x, bobber.y-22);
  }
}

function drawLine() {
  const midY = Math.min(rod.tipY,bobber.y)-50;
  if (state === 'casting') {
    ctx.save();
    ctx.globalAlpha = 0.5;
    ctx.strokeStyle = '#eafcff'; ctx.lineWidth = 3.2;
    ctx.shadowColor = 'rgba(180,240,255,0.8)'; ctx.shadowBlur = 6;
    ctx.beginPath();
    ctx.moveTo(rod.tipX, rod.tipY);
    ctx.quadraticCurveTo((rod.tipX+bobber.x)/2, midY, bobber.x, bobber.y);
    ctx.stroke();
    ctx.restore();
    for (let i=0;i<3;i++) {
      const back = Math.max(0, (bobber._t||0) - i*0.06);
      const bx = bobber._sx + (bobber.targetX-bobber._sx)*back;
      const by = bobber._sy + (bobber.targetY-bobber._sy)*back - Math.sin(back*Math.PI)*70;
      ctx.save();
      ctx.globalAlpha = 0.22 - i*0.06;
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(bx, by, 4-i, 0, Math.PI*2); ctx.fill();
      ctx.restore();
    }
  } else {
    ctx.strokeStyle = 'rgba(255,255,255,0.65)'; ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(rod.tipX, rod.tipY);
    ctx.quadraticCurveTo((rod.tipX+bobber.x)/2, midY, bobber.x, bobber.y);
    ctx.stroke();
  }
}

function drawRipples() {
  for (const r of ripples) {
    const p = r.t / 1.3;
    ctx.save();
    ctx.globalAlpha = Math.max(0, 0.5 * (1-p));
    ctx.strokeStyle = '#eaffff'; ctx.lineWidth = 2 - p;
    ctx.beginPath(); ctx.ellipse(r.x, r.y, 6 + p*46, 3 + p*16, 0, 0, Math.PI*2); ctx.stroke();
    ctx.restore();
  }
}

function drawReelUI() {
  if (state !== 'reeling') return;
  const isBoss = currentFish.rarity === 'boss';
  const barX = W/2-170, barY = H-130, barW = 340, barH = 24;

  ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(barX,barY,barW,barH);
  ctx.fillStyle = RARITY[currentFish.rarity].color; ctx.globalAlpha = 0.55;
  ctx.fillRect(barX+reel.zoneStart*barW, barY, reel.zoneWidth*barW, barH);
  ctx.globalAlpha = 1;
  const nx = barX + needleX()*barW;
  ctx.fillStyle = reel.flashT>0 ? '#fff' : (reel.runActive || reel.finalStand ? '#ff5252' : '#ff1744');
  ctx.fillRect(nx-2.2, barY-4, 4.4, barH+8);
  ctx.strokeStyle = isBoss ? '#ff3d3d' : '#fff'; ctx.lineWidth = 2; ctx.strokeRect(barX,barY,barW,barH);

  ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(barX,barY-34,barW,14);
  ctx.fillStyle = '#66bb6a'; ctx.fillRect(barX,barY-34,barW*(reel.progress/100),14);
  ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(barX,barY-18,barW,10);
  ctx.fillStyle = reel.tension>70 ? '#ff1744' : '#e53935'; ctx.fillRect(barX,barY-18,barW*(reel.tension/100),10);

  ctx.fillStyle = '#fff'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'left';
  ctx.fillText('진행도', barX, barY-38);
  ctx.fillText('장력', barX, barY-22);

  ctx.textAlign = 'center'; ctx.font = 'bold 13px sans-serif';
  ctx.fillStyle = RARITY[currentFish.rarity].color;
  ctx.fillText(`${starsStr(RARITY[currentFish.rarity].stars)}${isBoss ? '  BOSS' : ''}`, W/2, barY-46);
}

function draw(now) {
  ctx.save();
  if (shake > 0) ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
  drawBackground(now);
  drawRipples();
  drawLine();
  drawBobber();
  drawReelUI();
  ctx.restore();
}

function gameLoop(now) {
  const dt = Math.min((now-lastTime)/1000, 0.033);
  lastTime = now;
  update(dt);
  draw(now);

  // draw hooked fish inside the reveal card (canvas hero shot)
  if (state === 'result' && resultData && resultData.ok) {
    drawHeroFish();
  }
  requestAnimationFrame(gameLoop);
}

let heroCanvas, heroCtx;
function ensureHeroCanvas() {
  if (heroCanvas) return;
  heroCanvas = document.createElement('canvas');
  heroCanvas.width = 320; heroCanvas.height = 200;
  heroCanvas.style.cssText = 'display:block;margin:0 auto 4px;';
  document.getElementById('catchCard').insertBefore(heroCanvas, document.getElementById('newTag'));
  heroCtx = heroCanvas.getContext('2d');
}
const HERO_LEN = { whale:150, giant_squid:150, shark:180 };
function drawHeroFish() {
  ensureHeroCanvas();
  heroCtx.clearRect(0,0,heroCanvas.width, heroCanvas.height);
  // splash
  heroCtx.save();
  heroCtx.translate(heroCanvas.width/2, heroCanvas.height*0.82);
  heroCtx.fillStyle = 'rgba(255,255,255,0.5)';
  for (let i=0;i<10;i++) {
    const ang = (i/10)*Math.PI - Math.PI/2 - Math.PI/2;
    heroCtx.beginPath();
    heroCtx.ellipse(Math.cos(ang)*70, Math.sin(ang)*18, 14, 5, ang, 0, Math.PI*2);
    heroCtx.fill();
  }
  heroCtx.restore();

  heroCtx.save();
  heroCtx.translate(heroCanvas.width/2, heroCanvas.height*0.46);
  heroCtx.rotate(-0.12);
  drawFishShape(heroCtx, currentFish, HERO_LEN[currentFish.bodyType] || 200);
  heroCtx.restore();
}

/* =========================================================
   Dex UI
========================================================= */
const DEX_LEN = { whale:38, giant_squid:36, shark:44, turtle:34, crab:30, flat:34 };
function dexFishImage(def, locked) {
  const cnv = document.createElement('canvas');
  cnv.width = 72; cnv.height = 48;
  const cx = cnv.getContext('2d');
  if (locked) {
    cx.fillStyle = '#2a333b';
    cx.beginPath(); cx.ellipse(36,24,27,14,0,0,Math.PI*2); cx.fill();
    cx.fillStyle = '#5a6570'; cx.font = 'bold 18px sans-serif'; cx.textAlign = 'center'; cx.textBaseline = 'middle';
    cx.fillText('?', 36, 25);
  } else {
    cx.save();
    cx.translate(36, 25);
    cx.rotate(-0.05);
    drawFishShape(cx, def, DEX_LEN[def.bodyType] || 42);
    cx.restore();
  }
  return cnv.toDataURL();
}

let dexTab = 'lake';
function renderDex() {
  const grid = document.getElementById('dexGrid');
  grid.innerHTML = '';
  const src = dexTab === 'lake' ? LAKE_FISH : dexTab === 'sea' ? SEA_FISH : BOSS_FISH;
  const list = src.map(fishDef);
  for (const def of list) {
    const caught = dex[def.name];
    const card = document.createElement('div');
    card.className = 'dexCard' + (caught ? ' caught' : '') + (def.rarity==='boss' ? ' bossCardMini' : '');
    if (caught) card.style.setProperty('--rc', RARITY[def.rarity].color);
    card.innerHTML = `
      <img class="dexImg" src="${dexFishImage(def, !caught)}" width="72" height="48" alt="">
      <div class="name">${caught ? def.name : '???'}</div>
      <div class="stars" style="color:${caught ? RARITY[def.rarity].color : '#555'}">${caught ? starsStr(RARITY[def.rarity].stars) : '☆☆☆☆☆'}</div>
      ${caught ? `<div class="best">최대 ${caught.best}cm · ${caught.count}마리</div>` : ''}
    `;
    grid.appendChild(card);
  }
}

document.getElementById('dexBtn').addEventListener('click', () => { document.getElementById('dexOverlay').style.display='flex'; renderDex(); });
document.getElementById('dexClose').addEventListener('click', () => { document.getElementById('dexOverlay').style.display='none'; });
function activateTab(tab) {
  dexTab = tab;
  document.getElementById('tabLake').classList.toggle('active', tab==='lake');
  document.getElementById('tabSea').classList.toggle('active', tab==='sea');
  document.getElementById('tabSpecial').classList.toggle('active', tab==='special');
  renderDex();
}
document.getElementById('tabLake').addEventListener('click', () => activateTab('lake'));
document.getElementById('tabSea').addEventListener('click', () => activateTab('sea'));
document.getElementById('tabSpecial').addEventListener('click', () => activateTab('special'));
document.getElementById('locLake').addEventListener('click', () => {
  spot='lake'; state='idle';
  document.getElementById('locLake').classList.add('active'); document.getElementById('locSea').classList.remove('active');
  setMsg("스페이스바 또는 버튼으로 캐스팅하세요");
});
document.getElementById('locSea').addEventListener('click', () => {
  spot='sea'; state='idle';
  document.getElementById('locSea').classList.add('active'); document.getElementById('locLake').classList.remove('active');
  setMsg("스페이스바 또는 버튼으로 캐스팅하세요");
});

document.getElementById('tabLakeCount').textContent = LAKE_FISH.length;
document.getElementById('tabSeaCount').textContent = SEA_FISH.length;
document.getElementById('tabSpecialCount').textContent = BOSS_FISH.length;
document.getElementById('dexTotalCount').textContent = LAKE_FISH.length + SEA_FISH.length + BOSS_FISH.length;

document.getElementById('syncBtn').addEventListener('click', () => {
  document.getElementById('syncOverlay').style.display = 'flex';
  document.getElementById('syncCodeText').textContent = syncCode || '----------';
  setSyncStatus('');
});
document.getElementById('syncClose').addEventListener('click', () => {
  document.getElementById('syncOverlay').style.display = 'none';
});
document.getElementById('syncCopyBtn').addEventListener('click', async () => {
  if (!syncCode) return;
  try { await navigator.clipboard.writeText(syncCode); setSyncStatus('복사됨!'); }
  catch (e) { setSyncStatus(syncCode); }
});
document.getElementById('syncLoadBtn').addEventListener('click', () => {
  const input = document.getElementById('syncInput');
  const code = input.value.trim().toUpperCase();
  if (!code) { setSyncStatus('코드를 입력하세요.'); return; }
  loadSaveByCode(code);
});

updateTopStats();
ensureSyncCode();
requestAnimationFrame(gameLoop);
</script>
